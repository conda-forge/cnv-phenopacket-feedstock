{% set name = "cnv-phenopacket" %}
{% set version = "1.0.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/cnv_phenopacket-{{ version }}.tar.gz
  sha256: a4aeddbf74047a4864303e9b0f101b2fc5c15cdef4994fc27c04b399b7c259a0

build:
  entry_points:
    - cnv-phenopacket = phenopacket.cnv_phenopacket:tsv_to_phenopacket
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python {{ python_min }}
    - pip
  run:
    - python >={{ python_min }}
    - jsonschema

test:
  imports:
    - phenopacket
  commands:
    - pip check
    - cnv-phenopacket --help
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Convert TSV metadata to Phenopacket JSON
  license: CC-BY-NC-4.0
  home: https://pypi.org/project/cnv-phenopacket/

extra:
  recipe-maintainers:
    - khaled196
